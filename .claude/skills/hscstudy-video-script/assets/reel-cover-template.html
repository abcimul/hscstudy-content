<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<!-- HSC Study Reels/Shorts cover template, 1080×1920 (9:16). Replace every {{PLACEHOLDER}} and draw the topic visual in the VISUAL slot.
     Safe zones: platform buttons and captions cover the top 220px, the bottom 420px and the right 140px, so every word stays
     inside x 80–940, y 240–1500. The profile grid shows a 3:4 centre crop (y 240–1680): keep the hook and big number above y 1100. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&family=Outfit:wght@600;700;800;900&family=Noto+Serif+Bengali:wght@600;700&family=Fira+Code:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;background:#0B1220;font-family:"Hind Siliguri",sans-serif}
.t{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse 85% 70% at 50% 52%,#2B5384 0%,#1E3A5F 45%,#0B1220 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(169,196,230,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(169,196,230,.09) 1px,transparent 1px);background-size:44px 44px;
 -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 35%,transparent 100%)}
.ga{position:absolute;width:900px;height:900px;left:90px;top:860px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.30),transparent 62%);filter:blur(36px)}
.gb{position:absolute;width:760px;height:760px;left:-260px;top:120px;border-radius:50%;background:radial-gradient(circle,rgba(169,196,230,.18),transparent 65%);filter:blur(36px)}
.head{position:absolute;left:80px;right:140px;top:250px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand span{font:800 34px "Outfit";letter-spacing:.05em;color:#fff}.brand span i{font-style:normal;color:#A9C4E6;font-weight:600}
.pills{display:flex;gap:14px;align-items:center;margin-top:6px}
.pill{font:700 40px "Hind Siliguri";color:#3B2506;background:#F59E0B;padding:8px 28px 6px;border-radius:999px}
.pill2{font:600 36px "Hind Siliguri";color:#D3DCE8;background:rgba(43,83,132,.45);box-shadow:inset 0 0 0 2px rgba(169,196,230,.28);padding:8px 26px 6px;border-radius:999px}
.h1{font:700 140px/1.08 "Hind Siliguri";color:#fff;letter-spacing:0;margin-top:20px}
.big{display:flex;align-items:baseline;gap:16px;margin-top:-10px}
.n{font:800 330px/0.9 "Hind Siliguri";background:linear-gradient(180deg,#FDE68A 0%,#FBBF24 35%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 14px 34px rgba(245,158,11,.45))}
.q{font:800 230px/0.9 "Outfit";color:#fff}
.sub{font:600 56px/1.3 "Hind Siliguri";color:#D3DCE8;margin-top:6px}
.sub b{color:#fff}
.visual{position:absolute;left:260px;top:960px;width:560px;height:640px}
/* If the big word is longer than ~3 Bangla letters, lower .n (e.g. 220–280px) so .head stays inside 860px. */
</style></head><body>
<div class="t">
  <div class="ga"></div><div class="gb"></div><div class="grid"></div>

  <!-- VISUAL slot: an original SVG for this topic, drawn only with brand colors/gradients (references/brand.md). viewBox 560×640. -->
  <svg class="visual" viewBox="0 0 560 640" aria-hidden="true">
    {{VISUAL_SVG}}
  </svg>

  <div class="head fit">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 10V54M50 10V54M14 32H50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="14" cy="10" r="6.5" fill="#fff"/><circle cx="14" cy="32" r="6.5" fill="#fff"/><circle cx="14" cy="54" r="6.5" fill="#fff"/><circle cx="50" cy="10" r="6.5" fill="#fff"/><circle cx="50" cy="32" r="6.5" fill="#fff"/><circle cx="50" cy="54" r="6.5" fill="#fff"/><circle cx="32" cy="32" r="7.5" fill="#F59E0B"/></svg>
      <span>HSC <i>STUDY</i></span>
    </div>
    <div class="pills"><span class="pill">{{SERIES_PILL}}</span><span class="pill2">{{CHAPTER_PILL}}</span></div>
    <div class="h1">{{LINE1}}</div>
    <div class="big"><span class="n">{{BIG}}</span><span class="q">{{BIG_SUFFIX}}</span></div>
    <div class="sub"><b>{{SUBTITLE_BOLD}}</b> {{SUBTITLE_REST}}</div>
  </div>
</div>
</body></html>
