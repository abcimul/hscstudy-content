<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<!-- HSC Study thumbnail template, 1280×720. Replace every {{PLACEHOLDER}} and draw the topic visual in the VISUAL slot. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&family=Outfit:wght@600;700;800;900&family=Noto+Serif+Bengali:wght@600;700&family=Fira+Code:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;background:#0B1220;font-family:"Hind Siliguri",sans-serif}
.t{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse 80% 90% at 70% 45%,#2B5384 0%,#1E3A5F 45%,#0B1220 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(169,196,230,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(169,196,230,.09) 1px,transparent 1px);background-size:40px 40px;
 -webkit-mask-image:radial-gradient(ellipse 75% 80% at 60% 50%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 75% 80% at 60% 50%,#000 35%,transparent 100%)}
.ga{position:absolute;width:640px;height:640px;right:30px;top:20px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.32),transparent 62%);filter:blur(30px)}
.gb{position:absolute;width:560px;height:560px;left:-180px;bottom:-220px;border-radius:50%;background:radial-gradient(circle,rgba(169,196,230,.18),transparent 65%);filter:blur(30px)}
.left{position:absolute;left:64px;top:56px;bottom:56px;width:640px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.pill{align-self:flex-start;font:700 30px "Hind Siliguri";color:#3B2506;background:#F59E0B;padding:8px 22px 6px;border-radius:999px}
.h1{font:700 118px/1.05 "Hind Siliguri";color:#fff;letter-spacing:0;margin-top:10px}
.big{display:flex;align-items:baseline;gap:12px}
.n{font:800 250px/0.92 "Hind Siliguri";background:linear-gradient(180deg,#FDE68A 0%,#FBBF24 35%,#F59E0B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 12px 30px rgba(245,158,11,.45))}
.q{font:800 180px/0.9 "Outfit";color:#fff}
.sub{font:600 44px/1.3 "Hind Siliguri";color:#D3DCE8;margin-top:8px}
.sub b{color:#fff}
.logo{position:absolute;left:64px;bottom:40px;display:flex;align-items:center;gap:10px}
.logo span{font:800 26px "Outfit";letter-spacing:.05em;color:#fff}.logo span i{font-style:normal;color:#A9C4E6;font-weight:600}
.visual{position:absolute;right:40px;top:40px;width:560px;height:640px}
/* If the big word is long (more than ~3 Bangla letters), lower .n font-size (e.g. 160–200px) so the left column stays inside 640px. */
</style></head><body>
<div class="t">
  <div class="ga"></div><div class="gb"></div><div class="grid"></div>

  <!-- VISUAL slot: an original SVG for this topic, drawn only with brand colors/gradients (references/brand.md). 560×640. -->
  <svg class="visual" viewBox="0 0 560 640" aria-hidden="true">
    {{VISUAL_SVG}}
  </svg>

  <div class="left">
    <span class="pill">{{SERIES_LABEL}}</span>
    <div class="h1">{{LINE1}}</div>
    <div class="big"><span class="n">{{BIG}}</span><span class="q">{{BIG_SUFFIX}}</span></div>
    <div class="sub"><b>{{SUBTITLE_BOLD}}</b> {{SUBTITLE_REST}}</div>
  </div>

  <div class="logo">
    <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 10V54M50 10V54M14 32H50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="14" cy="10" r="6.5" fill="#fff"/><circle cx="14" cy="32" r="6.5" fill="#fff"/><circle cx="14" cy="54" r="6.5" fill="#fff"/><circle cx="50" cy="10" r="6.5" fill="#fff"/><circle cx="50" cy="32" r="6.5" fill="#fff"/><circle cx="50" cy="54" r="6.5" fill="#fff"/><circle cx="32" cy="32" r="7.5" fill="#F59E0B"/></svg>
    <span>HSC <i>STUDY</i></span>
  </div>
</div>
</body></html>
